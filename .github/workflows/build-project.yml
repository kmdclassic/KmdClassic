name: Build project

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      jobs:
        description: 'Parallel build jobs'
        required: false
        default: '2'
        type: string

permissions:
  contents: read

concurrency:
  group: build-project-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-project-job:
    # Do not execute fork PR code on a self-hosted runner.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 360
    name: Linux and Windows Qt 6

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read build metadata
        id: metadata
        shell: bash
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "builder_uid=$(id -u)" >> "$GITHUB_OUTPUT"
          echo "builder_gid=$(id -g)" >> "$GITHUB_OUTPUT"

      - name: Build wallets in Docker
        uses: ./.github/actions/build-project-docker
        with:
          builder-name: builder
          builder-uid: ${{ steps.metadata.outputs.builder_uid }}
          builder-gid: ${{ steps.metadata.outputs.builder_gid }}
          jobs: ${{ inputs.jobs || '2' }}

      - name: Archive Linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: kmdclassic-linux-${{ steps.metadata.outputs.sha_short }}
          path: releases/linux/
          if-no-files-found: error

      - name: Archive Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: kmdclassic-windows-${{ steps.metadata.outputs.sha_short }}
          path: releases/windows/
          if-no-files-found: error
